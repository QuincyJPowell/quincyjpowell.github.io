title: Quincy Powell

description: >-
  The personal website of Quincy Powell, exploring academic research,
  professional work, writing, development, art, and creative projects.

theme: minima

url: "https://quincyjpowell.github.io"
baseurl: ""

header_pages:
  - about.md
  - academic/index.md
  - professional/index.md
  - writing/index.md
  - development/index.md
  - art/index.md
  - portfolio/index.md
  - credentials/index.md
  - contact.md

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: project

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag

markdown: kramdown

kramdown:
  input: GFM
