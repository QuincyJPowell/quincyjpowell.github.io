<header class="site-header" role="banner">

  <div class="header-inner wrapper">

    <a class="site-title" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }} home">
      <span class="site-title-mark" aria-hidden="true">QP</span>
      <span class="site-title-text">{{ site.title | escape }}</span>
    </a>


    <nav class="site-nav" aria-label="Primary navigation">

      <button
        class="nav-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="primary-navigation"
        aria-label="Open navigation menu"
      >
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </button>


      <div class="trigger" id="primary-navigation">

        <a class="page-link" href="{{ '/about/' | relative_url }}">
          About
        </a>

        <a class="page-link" href="{{ '/academic/' | relative_url }}">
          Academic
        </a>

        <a class="page-link" href="{{ '/professional/' | relative_url }}">
          Professional
        </a>

        <a class="page-link" href="{{ '/writing/' | relative_url }}">
          Writing
        </a>

        <a class="page-link" href="{{ '/development/' | relative_url }}">
          Development
        </a>

        <a class="page-link" href="{{ '/art/' | relative_url }}">
          Art
        </a>

        <a class="page-link" href="{{ '/portfolio/' | relative_url }}">
          Portfolio &amp; Projects
        </a>

        <a class="page-link" href="{{ '/credentials/' | relative_url }}">
          Credentials
        </a>

        <a class="page-link" href="{{ '/contact/' | relative_url }}">
          Contact
        </a>

      </div>

    </nav>

  </div>

</header>

<script>
(() => {
  const nav = document.querySelector(".site-nav");
  const toggle = document.querySelector(".nav-toggle");
  const menu = document.querySelector("#primary-navigation");

  if (!nav || !toggle || !menu) return;

  toggle.addEventListener("click", () => {
    const isOpen = nav.classList.toggle("is-open");

    toggle.setAttribute(
      "aria-expanded",
      isOpen ? "true" : "false"
    );

    toggle.setAttribute(
      "aria-label",
      isOpen ? "Close navigation menu" : "Open navigation menu"
    );
  });

  document.addEventListener("click", (event) => {
    if (
      window.innerWidth <= 800 &&
      nav.classList.contains("is-open") &&
      !nav.contains(event.target)
    ) {
      nav.classList.remove("is-open");
      toggle.setAttribute("aria-expanded", "false");
      toggle.setAttribute("aria-label", "Open navigation menu");
    }
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      nav.classList.remove("is-open");
      toggle.setAttribute("aria-expanded", "false");
      toggle.setAttribute("aria-label", "Open navigation menu");
      toggle.blur();
    }
  });
})();
</script>
